# Two gates, both runnable verbatim on a laptop — that is the point of keeping
# them dependency-free:
#
#   npx eslint public/ tests/ eslint.config.js
#   node --test tests/*.test.js
#
# No package.json, no lockfile, no install step. eslint arrives through npx and
# the tests run on node:test, so a clean checkout can reproduce a red CI in one
# command.
#
# Note: public/shared/config.js is gitignored, so CI never sees it. eslint.config.js
# ignores it explicitly and the tests read config.example.js, which means a local
# run covers exactly the same files as this one.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: eslint
        run: npx --yes eslint@9 public/ tests/ eslint.config.js

  test:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Smoke tests
        # Shell-expanded rather than node's own glob: explicit paths work on every
        # Node that has node:test, pattern support does not.
        run: node --test tests/*.test.js
