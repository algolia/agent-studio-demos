# The static demos remain dependency-free. The React demo adds one build gate;
# the other checks stay runnable with npx and node:
#
#   npx eslint .
#   node --test tests/*.test.js
#   node scripts/check-copy.js
#
# The build job installs only the pinned React demo dependencies. eslint arrives
# through npx and the tests run on node:test.
#
# eslint lints the repo root rather than a list of directories, so a new folder
# of scripts is covered the day it lands instead of the day someone remembers to
# widen this line. Every directory that needs different globals already declares
# them in eslint.config.js.
#
# Note: public/shared/config.js is gitignored, so CI never sees it. eslint.config.js
# ignores it explicitly and the tests read config.example.js, which means a local
# run covers exactly the same files as this one.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  summary-card-build:
    name: summary-card build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install React demo dependencies
        run: npm ci
      - name: Build React InstantSearch demo
        run: npm run build:summary-card

  lint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: eslint
        run: npx --yes eslint@9 .

  test:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Smoke tests
        # Shell-expanded rather than node's own glob: explicit paths work on every
        # Node that has node:test, pattern support does not.
        run: node --test tests/*.test.js

  copy:
    name: copy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Readability and length budgets
        # Under two minutes a page, ninth grade as a ceiling, forty words a
        # tooltip, fifty a JS string run. The conversation is exempt; the page's
        # own voice is not. Rules and rationale: docs/_DESIGN.md.
        run: node scripts/check-copy.js
