# The context demos remain dependency-free. The React InstantSearch demo has an
# isolated npm build, so Dependabot watches that lockfile as well as Actions.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(actions)"
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(npm)"
    labels:
      - dependencies
