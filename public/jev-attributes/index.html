<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev trims the record</title>
<meta name="description" content="A country record has 13&nbsp;sections and a question needs one or two. Jev, the System One model by TypeSafe, reads the question and keeps those. Watch the record shrink.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:,">
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("ic-theme"); } catch (e) { /* private mode */ }
    var dark = saved ? saved === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
</head>
<body>
<a class="skip" href="#ask">Skip to the demo</a>

<header class="hero wrap">
  <div class="hero-top">
    <p class="eyebrow"><a href="../">Agent Studio demos</a></p>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
      <span class="glyph" id="theme-glyph" aria-hidden="true">◐</span>
      <span id="theme-label">Dark</span>
    </button>
  </div>
  <h1>Jev trims the record</h1>
  <p class="lede">Each country record has 13&nbsp;sections. A question needs one or two. Jev reads the question and keeps those.</p>
</header>

<main class="wrap">
  <section class="keycard" id="keycard" aria-label="Your Jev key"></section>

  <form class="ask" id="ask" autocomplete="off">
    <label class="sr-only" for="q">Question</label>
    <input id="q" type="text" maxlength="300" placeholder="Ask about any country">
    <button type="submit" class="btn" id="go">Ask</button>
  </form>
  <p class="chips" id="chips"></p>

  <ol class="flow" id="flow" aria-label="What happened"></ol>

  <section class="stage" id="stage" aria-live="polite"></section>
</main>

<footer class="wrap foot">
  <p>Data: CIA World Factbook, public domain. Search: Algolia. Decisions: Jev by TypeSafe.</p>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
